[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gtvremote"
dynamic = ["version"]
description = "Desktop remote control for Google TV / Android TV devices"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Faisal Alghamdi" }]
keywords = ["google-tv", "android-tv", "chromecast", "remote-control", "tkinter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Home Automation",
    "Topic :: Multimedia :: Video",
]
dependencies = ["cryptography>=41.0"]

[project.urls]
Homepage = "https://github.com/falghamdi125/Google-TV-Remote-for-Windows"
Releases = "https://github.com/falghamdi125/Google-TV-Remote-for-Windows/releases"
Issues = "https://github.com/falghamdi125/Google-TV-Remote-for-Windows/issues"

[project.optional-dependencies]
build = ["pyinstaller>=6"]
dev = ["pillow"]

[project.scripts]
gtvremote = "gtvremote.__main__:main"

[project.gui-scripts]
gtvremote-gui = "gtvremote.ui:main"

[tool.setuptools]
packages = ["gtvremote", "gtvremote.ui"]

[tool.setuptools.package-data]
gtvremote = ["assets/*.ico", "assets/icons/*.png"]

[tool.setuptools.dynamic]
version = { attr = "gtvremote.__version__" }
