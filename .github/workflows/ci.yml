name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Python tests (protocol vs. a mock TV, UI, parsers)
        run: python -m unittest -v

      - name: Generated key codes are up to date
        run: python tools/gen_keycodes.py --check

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Cross-check the encoder against protobufjs
        working-directory: tests
        run: |
          npm ci
          python make_cases.py
          node verify_encoding.js

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the standalone .exe and the .msi installer
        run: |
          pip install -e ".[build]"
          .\build_exe.bat
          python installer\build_msi.py

      - name: Attach them to the GitHub release (created if missing)
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Google TV Remote $tag" --generate-notes
          }
          $msi = (Get-ChildItem dist\GoogleTVRemote-*.msi).FullName
          gh release upload $tag dist/GoogleTVRemote.exe $msi --clobber
        env:
          GH_TOKEN: ${{ github.token }}
